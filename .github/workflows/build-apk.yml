name: Build Android APK

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # the ubuntu runner image already includes the Android SDK (ANDROID_HOME)

      - name: Build release APK (unsigned)
        run: |
          chmod +x gradlew
          ./gradlew android:assembleRelease --no-daemon

      # Uses the KEYSTORE_* repository secrets if they exist, so every build has the same signature
      # and can be installed over the previous one. Without them, a temporary key is generated,
      # and the previous build must be uninstalled before installing a new one.
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          else
            echo "No signing secrets found, using a temporary key"
            KEYSTORE_PASSWORD=temporary
            KEY_ALIAS=momo
            keytool -genkeypair -keystore release.jks -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Momo Pixel Dungeon"
          fi
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          UNSIGNED=$(ls android/build/outputs/apk/release/*.apk | head -n 1)
          "$BUILD_TOOLS/zipalign" -f 4 "$UNSIGNED" aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks release.jks --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" --out MomoPixelDungeon.apk aligned.apk
          "$BUILD_TOOLS/apksigner" verify MomoPixelDungeon.apk
          rm -f release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: MomoPixelDungeon-apk
          path: MomoPixelDungeon.apk
