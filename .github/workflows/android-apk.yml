# [Momo mod] Builds an installable Android APK on GitHub's servers.
# Download it from the repository's "Actions" tab -> latest run -> "Artifacts".
name: Build Android APK

on:
  push:
  workflow_dispatch:   # lets you start a build by hand from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew android:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MomoPixelDungeon-apk
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
