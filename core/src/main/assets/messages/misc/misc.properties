###mod additions
challenges.improved_food=Improved food
challenges.improved_food_desc=_This challenge does not affect score._\n\nMakes food easier to manage!\n\n- You can choose which treat replaces pasties (sparkling potion, steamed fish, chocolate amulet, easter egg, rainbow potion, green cake, pumpkin pie, blue cake or candy cane).\n- Food shows how much satiety it restores.\n- A satiety bar showing your current satiety is added below the experience bar.
challenges.improved_charge=Improved charging
challenges.improved_charge_desc=_This challenge does not affect score._\n\nKeep track of all your charges and cooldowns!\n\n- A message appears whenever one of your cooldowns ends.\n- Wands, artifacts and weapon charges show their charge speed and charge progress. A message appears when they become fully charged.\n- Examining an enemy shows its ability cooldowns and their progress.
challenges.improved_combat=Improved combat
challenges.improved_combat_desc=_This challenge does not affect score._\n\nKnow your enemy!\n\n- Examining an enemy shows its current health, accuracy, evasion, damage, armor, damage reduction, immunities, resistances, loot type, loot chance, experience given and the level at which it stops giving experience.\n- Your shields show how quickly they decay and the progress towards the next point of decay.
challenges.improved_explore=Improved exploration
challenges.improved_explore_desc=_This challenge does not affect score._\n\nNever miss a secret again!\n\n- Regular floor and wall tiles which you haven't stepped on or searched are marked with a small red cross (blue from floor 21 onward).\n- Special tiles such as altars, wooden floors, water, grass, moss, traps, bookshelves, alchemy pots, stairs, embers and chasms are never marked.\n- Boss floors and floor 26 have no marks.\n- Reading a scroll of magic mapping clears all marks on the floor.
challenges.huge_dungeon=Huge dungeon
challenges.huge_dungeon_desc=_This challenge does not affect score._\n\nThe dungeon has grown!\n\n- Every floor except boss floors, floor 1 and floor 26 is an unusually large floor.\n- Large floors have more rooms, enemies and items, and an extra ration.\n- Large floors replace any other level feeling that would have been rolled.

