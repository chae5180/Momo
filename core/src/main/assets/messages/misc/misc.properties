challenges.rabble=Rabble
challenges.rabble_desc=_This challenge does not affect score._\n\nThe dungeon is full of weaklings!\n\n- There are twice as many enemies (except bosses and quest enemies).\n- Enemies spawn 50% more often.\n- Enemies (except bosses and quest enemies) have 50% less health, damage, accuracy, evasion and armor.\n\nCannot be combined with Elite forces.
challenges.elite_forces=Elite forces
challenges.elite_forces_desc=_This challenge does not affect score._\n\nFewer enemies, but every one of them is deadly!\n\n- There are 50% fewer enemies (except bosses and quest enemies).\n- Enemies spawn 50% less often.\n- Enemies (except bosses and quest enemies) have 130% more health, damage, accuracy, evasion and armor.\n\nCannot be combined with Rabble.
challenges.improved_rarity=Improved rarity
challenges.improved_rarity_desc=_This challenge does not affect score._\n\nSpot rare enemies at a glance!\n\n- Rare enemy variants (except mimics) glow with a yellow aura.\n- Champion enemies keep their own champion aura.
challenges.improved_magic=Improved magic and curses
challenges.improved_magic_desc=_This challenge does not affect score._\n\nUnderstand exactly what your magic does!\n\n- Enchantments, glyphs and curses show their trigger chance and effects for your item.\n- Cursed wands (and the wondrous curse) show the list of possible cursed effects. This list can be turned on or off from the challenges window.

modenchantinfo.title=_Effect details:_
modenchantinfo.chance=- Trigger chance: %s
modenchantinfo.always=- Always active
modenchantinfo.effect=- Effect: %s
modenchantinfo.grim_chance=- Trigger chance: %1$s multiplied by (target's missing health)^2 (%2$s at half health)
modenchantinfo.vampiric_chance=- Trigger chance: %1$s at full health, up to %2$s at 0 health (currently %3$s)
modenchantinfo.blazing=sets the target on fire. Targets that are already burning take up to %2$d extra fire damage instead.
modenchantinfo.blocking=you gain %d shielding for 5 turns.
modenchantinfo.blooming=grows grass on about %s tiles around the target.
modenchantinfo.chilling=chills the target for %1$s turns (stacks up to %2$s turns).
modenchantinfo.corrupting=if this attack kills the target, it is corrupted instead of dying.
modenchantinfo.crystal=the weapon slowly loses durability as it is used.
modenchantinfo.elastic=knocks the target back %d tiles.
modenchantinfo.eldritch=terrifies the target for %s turns.
modenchantinfo.grim=instantly kills the target.
modenchantinfo.kinetic=excess damage from killing blows is stored, and added to your next hit.
modenchantinfo.lucky=if this attack kills the target, it drops extra loot.
modenchantinfo.projecting=melee reach is increased by %d tiles.
modenchantinfo.shocking=lightning arcs to nearby enemies, dealing %d%% of the damage dealt.
modenchantinfo.unstable=a random enchantment triggers on each hit.
modenchantinfo.vampiric=you heal for %d%% of the damage dealt.
modenchantinfo.venomous=poisons the target for %s more turns.
modenchantinfo.vorpal=the target bleeds for about half of the damage dealt.
modenchantinfo.annoying=makes a loud noise, attracting every enemy on the floor to you.
modenchantinfo.dazzling=blinds you and every character who can see the target.
modenchantinfo.displacing=teleports the target to a random location.
modenchantinfo.explosive=each hit adds about %s heat (out of 100). The weapon explodes when it overheats.
modenchantinfo.friendly=charms both you and the target, so you won't fight each other.
modenchantinfo.polarized=the attack deals 150% damage. Otherwise, it deals 0 damage.
modenchantinfo.pressurized=a geyser erupts at the target's location.
modenchantinfo.sacrificial=you may start bleeding, more likely and more severely at high health.
modenchantinfo.wayward=your accuracy is greatly reduced for 10 turns, or until your next hit.
modenchantinfo.wondrous=a random cursed wand effect happens.
modenchantinfo.affection=charms the attacker for %d turns.
modenchantinfo.antimagic=magical damage is reduced by %1$d~%2$d.
modenchantinfo.brimstone=you are immune to fire damage.
modenchantinfo.camouflage=you become invisible for %d turns after trampling tall grass.
modenchantinfo.entanglement=you are rooted, but gain %d earthen armor that absorbs damage.
modenchantinfo.flow=your movement speed is multiplied by %s while in water.
modenchantinfo.obfuscation=your stealth is increased by %s.
modenchantinfo.potential=your wands gain some charge.
modenchantinfo.repulsion=knocks adjacent attackers back %d tiles.
modenchantinfo.stone=you can't dodge, but damage taken is reduced based on how likely you were to dodge.
modenchantinfo.swiftness=your movement speed is multiplied by %s when no enemy is within 3 tiles.
modenchantinfo.thorns=the attacker bleeds for %d.
modenchantinfo.viscosity=%s of damage taken is deferred and dealt to you slowly over time.
modenchantinfo.antientropy=freezes the tiles around you, and sets you on fire.
modenchantinfo.bulk=your movement speed is multiplied by %s while in doorways.
modenchantinfo.corrosion=you and everyone next to you are covered in caustic ooze.
modenchantinfo.displacement=you are teleported to a random location, avoiding the attack.
modenchantinfo.metabolism=heals up to 4 health, using up 10 satiety per health healed.
modenchantinfo.multiplicity=a copy of the attacker or a mirror image of you appears.
modenchantinfo.overgrowth=a random plant activates under you.
modenchantinfo.stench=releases toxic gas around you.
